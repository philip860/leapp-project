---
- name: Upgrade
  hosts: "{{ rhel_inventory_group | default(omit) }}"
  strategy: free
  gather_facts: true
  become: true
  force_handlers: true

  vars:
    leapp_upgrade_type: "{{ leapp_upgrade_type | default('cdn') }}"

  pre_tasks:
    - name: Show Leapp upgrade mode
      ansible.builtin.debug:
        msg:
          - "Leapp upgrade type: {{ leapp_upgrade_type }}"
          - "AWS RHUI from analysis: {{ analysis_is_aws_rhui | default(false) }}"

  tasks:
    - name: Upgrade block
      block:
        - name: Perform OS upgrade
          ansible.builtin.import_role:
            name: infra.leapp.upgrade

      always:
        - name: Log upgrade status
          when:
            - splunk_hectoken is defined
            - splunk_url is defined
            - splunk_index is defined
          block:
            - name: Gather EC2 metadata facts
              amazon.aws.ec2_metadata_facts:
              delegate_to: localhost
              become: false
              ignore_errors: true
              when:
                - ansible_system_vendor is defined
                - ansible_system_vendor in ["Amazon EC2", "Xen"]

            - name: Send event to Splunk
              ansible.builtin.uri:
                url: "{{ splunk_url }}"
                headers:
                  Authorization: "Splunk {{ splunk_hectoken }}"
                method: POST
                body:
                  sourcetype: _json
                  index: "{{ splunk_index }}"
                  event:
                    event_type: playbook_run
                    hostname: "{{ ansible_facts.hostname | default(inventory_hostname) }}"
                    job_id: "{{ awx_job_id | default('undefined') }}"
                    os_version: "{{ ansible_facts.distribution_version | default('undefined') }}"
                    system_vendor: "{{ ansible_system_vendor | default('unknown') }}"
                    rhui_host: "{{ analysis_is_aws_rhui | default(false) }}"
                    leapp_upgrade_type: "{{ leapp_upgrade_type }}"
                    pet_app_env: "{{ ['Dev','Test','Prod'] | random(seed=inventory_hostname) }}"
                    pet_app_team: "{{ ['Bird','Cat','Dog','Fish','Hamster','Lizard','Snake'] | random(seed=inventory_hostname) }}"
                    region: "{{ ansible_ec2_placement_region | default('undefined') }}"
                    play_name: "{{ ansible_play_name | default('Upgrade') }}"
                    success: "{{ leapp_upgrade_success | default(false) }}"
                body_format: json
                return_content: true
              delegate_to: localhost
              become: false
              changed_when: false
              ignore_errors: true
              register: splunk_send
              no_log: true

            - name: Show send result
              ansible.builtin.debug:
                msg: "Splunk event send attempted."
              when: splunk_send is defined
...