---
- name: Wait for connection...
  ansible.builtin.wait_for_connection:
    connect_timeout: 20
    sleep: 5
    delay: 5
    timeout: 300

- name: Check for leapp utility
  ansible.builtin.stat:
    path: /usr/bin/leapp
  register: leapp_utility_check

- name: Configure sshd
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^(#)?{{ item.key }}"
    line: "{{ item.key }} {{ item.value }}"
    state: present
  loop:
    - { key: "PermitRootLogin", value: "prohibit-password" }
    - { key: "PasswordAuthentication", value: "no" }
  notify:
    - Restart sshd

- name: Show leapp status for RHEL 9
  ansible.builtin.debug:
    msg: "Leapp is installed. RHEL 9 remediation tasks can run for RHEL 9 to RHEL 10 upgrade."
  when: leapp_utility_check.stat.exists

- name: Warn when leapp is missing
  ansible.builtin.debug:
    msg: "Leapp is not installed on this RHEL 9 host. Skipping Leapp-specific remediation."
  when: not leapp_utility_check.stat.exists

- name: Find legacy ifcfg network configuration files
  ansible.builtin.find:
    paths: /etc/sysconfig/network-scripts
    patterns: "ifcfg-*"
    file_type: file
  register: rhel9_ifcfg_files
  when: leapp_utility_check.stat.exists

- name: Create backup directory for ifcfg files
  ansible.builtin.file:
    path: /root/leapp-ifcfg-backup
    state: directory
    owner: root
    group: root
    mode: "0700"
  when:
    - leapp_utility_check.stat.exists
    - rhel9_ifcfg_files.matched | default(0) | int > 0

- name: Backup legacy ifcfg network configuration files
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "/root/leapp-ifcfg-backup/{{ item.path | basename }}"
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  loop: "{{ rhel9_ifcfg_files.files | default([]) }}"
  when:
    - leapp_utility_check.stat.exists
    - rhel9_ifcfg_files.matched | default(0) | int > 0

- name: Migrate all NetworkManager ifcfg connections to keyfile format
  ansible.builtin.command: nmcli connection migrate
  register: rhel9_nmcli_migrate
  changed_when: rhel9_nmcli_migrate.rc == 0
  failed_when: false
  when:
    - leapp_utility_check.stat.exists
    - rhel9_ifcfg_files.matched | default(0) | int > 0

- name: Reload NetworkManager after keyfile migration
  ansible.builtin.command: nmcli connection reload
  changed_when: false
  failed_when: false
  when:
    - leapp_utility_check.stat.exists
    - rhel9_ifcfg_files.matched | default(0) | int > 0

- name: Recheck legacy ifcfg files after migration
  ansible.builtin.find:
    paths: /etc/sysconfig/network-scripts
    patterns: "ifcfg-*"
    file_type: file
  register: rhel9_ifcfg_after_migration
  when: leapp_utility_check.stat.exists

- name: Remove remaining legacy ifcfg files after backup and migration
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ rhel9_ifcfg_after_migration.files | default([]) }}"
  when:
    - leapp_utility_check.stat.exists
    - rhel9_ifcfg_after_migration.matched | default(0) | int > 0

- name: Check current kernel command line
  ansible.builtin.command: cat /proc/cmdline
  register: rhel9_cmdline
  changed_when: false
  when: leapp_utility_check.stat.exists

- name: Remove explicit NVMe multipath disablement from GRUB
  ansible.builtin.command: grubby --update-kernel=ALL --remove-args="nvme_core.multipath=N"
  register: rhel9_remove_nvme_mpath_disable
  changed_when: rhel9_remove_nvme_mpath_disable.rc == 0
  failed_when: false
  when: leapp_utility_check.stat.exists

- name: Enable NVMe native multipath in GRUB
  ansible.builtin.command: grubby --update-kernel=ALL --args="nvme_core.multipath=Y"
  register: rhel9_enable_nvme_mpath
  changed_when: rhel9_enable_nvme_mpath.rc == 0
  failed_when: false
  when: leapp_utility_check.stat.exists

- name: Set NVMe reboot required fact
  ansible.builtin.set_fact:
    rhel9_reboot_required: true
  when:
    - leapp_utility_check.stat.exists
    - "'nvme_core.multipath=N' in rhel9_cmdline.stdout"

- name: Check for broken vdo.service systemd symlink
  ansible.builtin.stat:
    path: /etc/systemd/system/multi-user.target.wants/vdo.service
  register: rhel9_vdo_symlink
  when: leapp_utility_check.stat.exists

- name: Remove broken vdo.service systemd symlink
  ansible.builtin.file:
    path: /etc/systemd/system/multi-user.target.wants/vdo.service
    state: absent
  when:
    - leapp_utility_check.stat.exists
    - rhel9_vdo_symlink.stat.exists | default(false)

- name: Reload systemd after removing broken symlink
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - leapp_utility_check.stat.exists
    - rhel9_vdo_symlink.stat.exists | default(false)

- name: Check loaded kernel modules removed or unsupported in RHEL 10
  ansible.builtin.shell: |
    set -o pipefail
    lsmod | awk '{print $1}' | grep -E '^(qla4xxx|bnx2i|cnic)$' || true
  args:
    executable: /bin/bash
  register: rhel9_loaded_removed_modules
  changed_when: false
  when: leapp_utility_check.stat.exists

- name: Warn about loaded RHEL 10 removed or unmaintained drivers
  ansible.builtin.debug:
    msg: >-
      Loaded kernel modules detected that may block or risk RHEL 9 to 10 upgrade:
      {{ rhel9_loaded_removed_modules.stdout_lines }}.
      qla4xxx will be unloaded with modprobe -r, blacklisted, removed from initramfs,
      and verified after reboot.
  when:
    - leapp_utility_check.stat.exists
    - rhel9_loaded_removed_modules.stdout | length > 0

- name: Attempt to unload qla4xxx module
  ansible.builtin.command: modprobe -r qla4xxx
  register: rhel9_unload_qla4xxx
  changed_when: rhel9_unload_qla4xxx.rc == 0
  failed_when: false
  when:
    - leapp_utility_check.stat.exists
    - "'qla4xxx' in rhel9_loaded_removed_modules.stdout_lines"

- name: Blacklist qla4xxx kernel module
  ansible.builtin.copy:
    dest: /etc/modprobe.d/blacklist-qla4xxx.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Disabled for RHEL 9 to RHEL 10 Leapp upgrade.
      blacklist qla4xxx
      install qla4xxx /bin/false
  when: leapp_utility_check.stat.exists

- name: Exclude qla4xxx from initramfs
  ansible.builtin.copy:
    dest: /etc/dracut.conf.d/omit-qla4xxx.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Disabled for RHEL 9 to RHEL 10 Leapp upgrade.
      omit_drivers+=" qla4xxx "
  when: leapp_utility_check.stat.exists

- name: Rebuild initramfs after qla4xxx blacklist
  ansible.builtin.command: dracut -f --regenerate-all
  register: rhel9_dracut_qla4xxx
  changed_when: rhel9_dracut_qla4xxx.rc == 0
  when: leapp_utility_check.stat.exists

- name: Set qla4xxx reboot required fact
  ansible.builtin.set_fact:
    rhel9_reboot_required: true
  when:
    - leapp_utility_check.stat.exists
    - "'qla4xxx' in rhel9_loaded_removed_modules.stdout_lines"

- name: Check for libdb packages
  ansible.builtin.package_facts:
    manager: auto
  when: leapp_utility_check.stat.exists

- name: Warn when Berkeley DB packages are installed
  ansible.builtin.debug:
    msg: >-
      Berkeley DB/libdb packages are installed. RHEL 10 does not include libdb.
      Review applications depending on libdb and migrate their data before upgrade.
  when:
    - leapp_utility_check.stat.exists
    - "'libdb' in ansible_facts.packages or 'libdb-utils' in ansible_facts.packages"

- name: Check XFS filesystems and bigtime support
  ansible.builtin.command: xfs_info /
  register: rhel9_xfs_root_info
  changed_when: false
  failed_when: false
  when: leapp_utility_check.stat.exists

- name: Warn when root XFS filesystem does not show bigtime enabled
  ansible.builtin.debug:
    msg: >-
      Root filesystem appears to be XFS without bigtime enabled. Leapp reports this as low risk.
      Do not run xfs_admin -O bigtime=1 against a mounted root filesystem. Schedule offline
      maintenance if you want to enable it.
  when:
    - leapp_utility_check.stat.exists
    - rhel9_xfs_root_info.rc == 0
    - "'bigtime=1' not in rhel9_xfs_root_info.stdout"

- name: Reboot host after RHEL 9 remediation changes
  ansible.builtin.reboot:
    msg: "Rebooting after RHEL 9 to RHEL 10 Leapp remediation changes."
    connect_timeout: 20
    reboot_timeout: 900
    pre_reboot_delay: 5
    post_reboot_delay: 45
    test_command: whoami
  when:
    - leapp_utility_check.stat.exists
    - rhel9_reboot_required | default(false) | bool

- name: Wait for host to come back after remediation reboot
  ansible.builtin.wait_for_connection:
    connect_timeout: 20
    sleep: 10
    delay: 10
    timeout: 600
  when:
    - leapp_utility_check.stat.exists
    - rhel9_reboot_required | default(false) | bool

- name: Recheck qla4xxx module after reboot
  ansible.builtin.shell: |
    lsmod | awk '{print $1}' | grep -x qla4xxx || true
  register: rhel9_qla4xxx_recheck
  changed_when: false
  when: leapp_utility_check.stat.exists

- name: Recheck current kernel command line after reboot
  ansible.builtin.command: cat /proc/cmdline
  register: rhel9_cmdline_after_reboot
  changed_when: false
  when: leapp_utility_check.stat.exists

- name: Recheck legacy ifcfg files after reboot
  ansible.builtin.find:
    paths: /etc/sysconfig/network-scripts
    patterns: "ifcfg-*"
    file_type: file
  register: rhel9_ifcfg_after_reboot
  when: leapp_utility_check.stat.exists

- name: Fail if qla4xxx is still loaded after reboot
  ansible.builtin.fail:
    msg: >-
      qla4xxx is still loaded after modprobe removal, blacklist, initramfs rebuild, and reboot.
      Leapp will likely continue to report this as a RHEL 10 removed-driver inhibitor.
  when:
    - leapp_utility_check.stat.exists
    - rhel9_qla4xxx_recheck.stdout | length > 0

- name: Fail if NVMe native multipath is still disabled after reboot
  ansible.builtin.fail:
    msg: >-
      nvme_core.multipath=N is still present in /proc/cmdline after remediation reboot.
      Leapp will continue to report the NVMe native multipath inhibitor.
  when:
    - leapp_utility_check.stat.exists
    - "'nvme_core.multipath=N' in rhel9_cmdline_after_reboot.stdout"

- name: Fail if legacy ifcfg files still exist after migration
  ansible.builtin.fail:
    msg: >-
      Legacy ifcfg files still exist after migration:
      {{ rhel9_ifcfg_after_reboot.files | map(attribute='path') | list }}.
      Leapp will continue to report the legacy network configuration inhibitor.
  when:
    - leapp_utility_check.stat.exists
    - rhel9_ifcfg_after_reboot.matched | default(0) | int > 0

- name: Confirm qla4xxx is not loaded
  ansible.builtin.debug:
    msg: "qla4xxx is not loaded after remediation."
  when: leapp_utility_check.stat.exists

- name: Confirm NVMe native multipath is not disabled
  ansible.builtin.debug:
    msg: "nvme_core.multipath=N is not present after remediation."
  when: leapp_utility_check.stat.exists

- name: Confirm legacy ifcfg files are removed
  ansible.builtin.debug:
    msg: "Legacy ifcfg files are removed after NetworkManager keyfile migration."
  when: leapp_utility_check.stat.exists

- name: Final RHEL 9 remediation summary
  ansible.builtin.debug:
    msg: >-
      RHEL 9 remediation completed successfully. qla4xxx is not loaded,
      nvme_core.multipath=N is removed, legacy ifcfg files are gone,
      and the host is reachable.
...