---
- name: Analysis
  hosts: "{{ rhel_inventory_group | default(omit) }}"
  strategy: free
  gather_facts: true
  become: true
  force_handlers: true

  vars:
    rhsm_activate: "{{ rhsm_activate | default(false) | bool }}"

    rhsm_username: "{{ rhsm_username | default('') }}"
    rhsm_password: "{{ rhsm_password | default('') }}"

    rhsm_activation_key: "{{ rhsm_activation_key | default('') }}"
    rhsm_org: "{{ rhsm_org | default('') }}"

    rhsm_server_url: "{{ rhsm_server_url | default('') }}"
    rhsm_auto_attach: "{{ rhsm_auto_attach | default(true) | bool }}"

  pre_tasks:
    - name: Validate supported RHEL major version
      ansible.builtin.assert:
        that:
          - ansible_distribution == "RedHat"
          - ansible_distribution_major_version | int in [7, 8, 9]
        fail_msg: >-
          {{ inventory_hostname }} is not a supported RHEL 7, 8, or 9 host.
          Detected: {{ ansible_distribution }} {{ ansible_distribution_version }}

    - name: Report RHSM registration disabled
      ansible.builtin.debug:
        msg: >-
          RHSM registration is disabled for {{ inventory_hostname }}.
          Skipping RHSM/Satellite registration and continuing analysis.
      when: not rhsm_activate | bool

    - name: Check RHSM registration status
      ansible.builtin.command: subscription-manager identity
      register: rhsm_identity
      changed_when: false
      failed_when: false
      when: rhsm_activate | bool

    - name: Show RHSM registration status
      ansible.builtin.debug:
        msg: >-
          RHSM activation requested for {{ inventory_hostname }}.
          Current registration status:
          {% if rhsm_identity.rc == 0 %}
          REGISTERED.
          {% else %}
          NOT REGISTERED.
          {% endif %}
      when: rhsm_activate | bool

    - name: Validate RHSM/Satellite credential variables
      ansible.builtin.assert:
        that:
          - >
            (
              rhsm_activation_key | length > 0 and
              rhsm_org | length > 0
            )
            or
            (
              rhsm_username | length > 0 and
              rhsm_password | length > 0
            )
        fail_msg: >-
          rhsm_activate=true but credentials are incomplete.

          Provide either:
          rhsm_activation_key + rhsm_org

          OR:
          rhsm_username + rhsm_password
      when:
        - rhsm_activate | bool
        - rhsm_identity.rc != 0

    - name: Register host using RHSM/Satellite activation key
      community.general.redhat_subscription:
        state: present
        activationkey: "{{ rhsm_activation_key }}"
        org_id: "{{ rhsm_org }}"
        server_hostname: "{{ rhsm_server_url | default(omit, true) }}"
        auto_attach: "{{ rhsm_auto_attach }}"
      register: rhsm_activation_result
      failed_when: false
      no_log: true
      when:
        - rhsm_activate | bool
        - rhsm_identity.rc != 0
        - rhsm_activation_key | length > 0
        - rhsm_org | length > 0

    - name: Register host using RHSM/Satellite username and password
      community.general.redhat_subscription:
        state: present
        username: "{{ rhsm_username }}"
        password: "{{ rhsm_password }}"
        server_hostname: "{{ rhsm_server_url | default(omit, true) }}"
        auto_attach: "{{ rhsm_auto_attach }}"
      register: rhsm_userpass_result
      failed_when: false
      no_log: true
      when:
        - rhsm_activate | bool
        - rhsm_identity.rc != 0
        - rhsm_username | length > 0
        - rhsm_password | length > 0
        - >
          rhsm_activation_result is not defined
          or
          rhsm_activation_result.failed | default(false)

    - name: Verify final RHSM registration status
      ansible.builtin.command: subscription-manager identity
      register: rhsm_final_check
      changed_when: false
      failed_when: false
      when: rhsm_activate | bool

    - name: Fail when all RHSM registration methods failed
      ansible.builtin.fail:
        msg: >-
          RHSM registration failed on {{ inventory_hostname }}.

          Attempted available authentication methods.

          Verify:
          - rhsm_activation_key
          - rhsm_org
          - rhsm_username/password
          - rhsm_server_url
      when:
        - rhsm_activate | bool
        - rhsm_final_check.rc != 0

    - name: Refresh subscription and repository metadata after registration
      ansible.builtin.shell: |
        subscription-manager refresh || true

        if command -v dnf >/dev/null 2>&1; then
          dnf clean all
          dnf makecache
        else
          yum clean all
          yum makecache
        fi
      args:
        executable: /bin/bash
      changed_when: true
      when:
        - rhsm_activate | bool
        - rhsm_identity.rc != 0
        - rhsm_final_check.rc == 0

    - name: Register yum/dnf repolist
      ansible.builtin.shell: |
        set -o pipefail

        if command -v dnf >/dev/null 2>&1; then
          dnf repolist
        else
          yum repolist
        fi
      args:
        executable: /bin/bash
      register: yum_repolist
      changed_when: false
      failed_when: false

    - name: Detect AWS RHUI marketplace host
      ansible.builtin.set_fact:
        analysis_is_aws_rhui: >-
          {{
            (
              ansible_system_vendor | default('') in ['Amazon EC2', 'Xen']
              or
              ansible_product_uuid | default('') | regex_search('^(ec2|EC2)')
            )
            and
            (
              'rhui' in (yum_repolist.stdout | default('') | lower)
            )
          }}

    - name: Set RHUI RHEL 7 extras repo
      ansible.builtin.set_fact:
        analysis_repos_el7: rhel-7-server-rhui-extras-rpms
      when:
        - analysis_is_aws_rhui | bool
        - ansible_distribution_major_version | int == 7

    - name: Set RHUI Leapp package facts
      ansible.builtin.set_fact:
        analysis_packages_el7:
          - leapp-rhui-aws
          - cockpit
          - cockpit-system
          - cockpit-leapp
        analysis_packages_el8:
          - leapp-rhui-aws
          - leapp-upgrade
          - cockpit
          - cockpit-system
          - cockpit-leapp
          - vdo
        analysis_packages_el9:
          - leapp
          - leapp-upgrade
          - cockpit
          - cockpit-system
      when: analysis_is_aws_rhui | bool

    - name: Set standard Leapp package facts for non-RHUI hosts
      ansible.builtin.set_fact:
        analysis_packages_el7:
          - leapp
          - cockpit
          - cockpit-system
          - cockpit-leapp
        analysis_packages_el8:
          - leapp
          - leapp-upgrade
          - cockpit
          - cockpit-system
          - cockpit-leapp
          - vdo
        analysis_packages_el9:
          - leapp
          - leapp-upgrade
          - cockpit
          - cockpit-system
      when: not analysis_is_aws_rhui | bool

    - name: Check if leapp command exists
      ansible.builtin.shell: command -v leapp
      args:
        executable: /bin/bash
      register: leapp_command_check
      changed_when: false
      failed_when: false

    - name: Install Leapp package set
      ansible.builtin.package:
        name: >-
          {{
            analysis_packages_el7
            if ansible_distribution_major_version | int == 7
            else analysis_packages_el8
            if ansible_distribution_major_version | int == 8
            else analysis_packages_el9
          }}
        state: present
      register: leapp_install_result
      failed_when: false
      when: leapp_command_check.rc != 0

    - name: Re-check if leapp command exists after install
      ansible.builtin.shell: command -v leapp
      args:
        executable: /bin/bash
      register: leapp_command_recheck
      changed_when: false
      failed_when: false
      when: leapp_command_check.rc != 0

    - name: Fail clearly when Leapp is unavailable
      ansible.builtin.fail:
        msg: >-
          Missing Leapp package on {{ inventory_hostname }}.
          Leapp was not found and could not be installed.

          RHSM registration enabled: {{ rhsm_activate }}.

          {% if rhsm_activate | bool %}
          Check RHSM/Satellite registration, enabled repositories, or rhsm_server_url.
          {% elif analysis_is_aws_rhui | default(false) | bool %}
          RHSM registration is disabled and this appears to be an AWS RHUI host.
          Check RHUI repositories and package availability.
          {% else %}
          RHSM registration is disabled.
          Enable RHSM/Satellite registration or ensure Leapp repositories are already available.
          {% endif %}
      when:
        - leapp_command_check.rc != 0
        - leapp_command_recheck.rc | default(1) != 0

    - name: Show final Leapp readiness status
      ansible.builtin.debug:
        msg: >-
          Final Leapp readiness for {{ inventory_hostname }}:
          {% if leapp_command_check.rc == 0 %}
          READY - leapp was already installed at {{ leapp_command_check.stdout }}.
          {% elif leapp_command_recheck.rc | default(1) == 0 %}
          READY - leapp was installed at {{ leapp_command_recheck.stdout }}.
          {% else %}
          NOT READY - leapp is unavailable.
          {% endif %}

  roles:
    - infra.leapp.analysis

  tasks:
    - name: Check if Leapp answerfile exists
      ansible.builtin.stat:
        path: /var/log/leapp/answerfile
      register: leapp_answerfile

    - name: Confirm check_vdo True in Leapp answerfile
      ansible.builtin.replace:
        path: /var/log/leapp/answerfile
        regexp: '(\[check_vdo\][\s\S]*?)# confirm ='
        replace: '\1confirm = True'
      when: leapp_answerfile.stat.exists

    - name: Get report file status
      ansible.builtin.stat:
        path: /var/log/leapp/leapp-report.json
      register: report_file

    - name: Log preupgrade report
      when:
        - report_file.stat.exists
        - splunk_url is defined
        - splunk_index is defined
        - splunk_hectoken is defined
      block:
        - name: Gather EC2 metadata facts when running on EC2
          amazon.aws.ec2_metadata_facts:
          ignore_errors: true
          when: analysis_is_aws_rhui | default(false) | bool

        - name: Collect JSON report results
          ansible.builtin.slurp:
            src: /var/log/leapp/leapp-report.json
          register: leapp_report

        - name: Send event to Splunk
          ansible.builtin.uri:
            url: "{{ splunk_url }}"
            headers:
              Authorization: "Splunk {{ splunk_hectoken }}"
            method: POST
            body:
              sourcetype: _json
              index: "{{ splunk_index }}"
              event:
                event_type: leapp_report
                hostname: "{{ ansible_facts.hostname }}"
                fqdn: "{{ ansible_facts.fqdn | default(inventory_hostname) }}"
                job_id: "{{ awx_job_id | default('undefined') }}"
                os_version: "{{ ansible_facts.distribution_version }}"
                virtualization_type: "{{ ansible_virtualization_type | default('unknown') }}"
                virtualization_role: "{{ ansible_virtualization_role | default('unknown') }}"
                system_vendor: "{{ ansible_system_vendor | default('unknown') }}"
                product_name: "{{ ansible_product_name | default('unknown') }}"
                rhsm_activate: "{{ rhsm_activate }}"
                rhsm_server_url: "{{ rhsm_server_url | default('') }}"
                rhui_host: "{{ analysis_is_aws_rhui | default(false) }}"
                pet_app_env: "{{ ['Dev', 'Test', 'Prod'] | random(seed=ansible_facts.hostname) }}"
                pet_app_team: "{{ ['Bird', 'Cat', 'Dog', 'Fish', 'Hamster', 'Lizard', 'Snake'] | random(seed=ansible_facts.hostname) }}"
                region: "{{ ansible_ec2_placement_region | default('undefined') }}"
                report: "{{ leapp_report.content | b64decode | from_json }}"
            body_format: json
            return_content: true
          delegate_to: localhost
          become: false
          changed_when: false
          ignore_errors: true
          register: splunk_send
          no_log: true

        - name: Show Splunk send result
          ansible.builtin.debug:
            var: splunk_send
          when: splunk_send is defined