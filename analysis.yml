---
- name: Analysis
  hosts: "{{ rhel_inventory_group | default(omit) }}"
  strategy: free
  gather_facts: true
  become: true
  force_handlers: true

  vars:
    rhsm_activate: "{{ rhsm_activate | default(false) }}"
    rhsm_username: "{{ rhsm_username | default('') | trim }}"
    rhsm_password: "{{ rhsm_password | default('') | trim }}"
    rhsm_activation_key: "{{ rhsm_activation_key | default('') | trim }}"
    rhsm_org: "{{ rhsm_org | default('') | trim }}"
    rhsm_server_url: "{{ rhsm_server_url | default('') | trim }}"
    rhsm_auto_attach: "{{ rhsm_auto_attach | default(true) }}"

    # Default to CDN unless AWS RHUI is detected below.
    leapp_upgrade_type: "{{ leapp_upgrade_type | default('cdn') }}"

  pre_tasks:
    - name: Normalize RHSM flags
      ansible.builtin.set_fact:
        rhsm_activate_requested: "{{ rhsm_activate | string | lower in ['true', 'yes', '1', 'on'] }}"
        rhsm_auto_attach_requested: "{{ rhsm_auto_attach | string | lower in ['true', 'yes', '1', 'on'] }}"

    - name: Validate supported RHEL major version
      ansible.builtin.assert:
        that:
          - ansible_distribution == "RedHat"
          - ansible_distribution_major_version | int in [7, 8, 9]
        fail_msg: >-
          {{ inventory_hostname }} is not a supported RHEL 7, 8, or 9 host.
          Detected: {{ ansible_distribution }} {{ ansible_distribution_version }}

    - name: Report RHSM registration disabled
      ansible.builtin.debug:
        msg: >-
          RHSM registration is disabled for {{ inventory_hostname }}.
          Skipping RHSM/Satellite registration and continuing analysis.
      when: not rhsm_activate_requested | bool

    - name: Check RHSM registration status
      ansible.builtin.command: subscription-manager identity
      register: rhsm_identity
      changed_when: false
      failed_when: false
      when: rhsm_activate_requested | bool

    - name: Show RHSM registration status
      ansible.builtin.debug:
        msg: >-
          RHSM activation requested for {{ inventory_hostname }}.
          Current registration status:
          {% if rhsm_identity.rc == 0 %}
          REGISTERED.
          {% else %}
          NOT REGISTERED.
          {% endif %}
      when:
        - rhsm_activate_requested | bool
        - rhsm_identity is defined

    - name: Validate RHSM/Satellite credential variables
      ansible.builtin.assert:
        that:
          - >
            (
              rhsm_activation_key | length > 0 and
              rhsm_org | length > 0
            )
            or
            (
              rhsm_username | length > 0 and
              rhsm_password | length > 0
            )
        fail_msg: >-
          rhsm_activate=true but credentials are incomplete.

          Provide either:
          - rhsm_activation_key + rhsm_org

          OR:
          - rhsm_username + rhsm_password
      when:
        - rhsm_activate_requested | bool
        - rhsm_identity is defined
        - rhsm_identity.rc != 0

    - name: Clean stale RHSM state before registration
      ansible.builtin.command: subscription-manager clean
      changed_when: true
      failed_when: false
      when:
        - rhsm_activate_requested | bool
        - rhsm_identity is defined
        - rhsm_identity.rc != 0

    - name: Configure RHSM server URL for Satellite when provided
      ansible.builtin.command: subscription-manager config --server.hostname={{ rhsm_server_url }}
      changed_when: true
      failed_when: false
      when:
        - rhsm_activate_requested | bool
        - rhsm_identity is defined
        - rhsm_identity.rc != 0
        - rhsm_server_url | length > 0

    - name: Register host using activation key and org
      ansible.builtin.command: >
        subscription-manager register
        --org={{ rhsm_org }}
        --activationkey={{ rhsm_activation_key }}
        --force
      register: rhsm_activation_result
      changed_when: rhsm_activation_result.rc == 0
      failed_when: false
      no_log: true
      when:
        - rhsm_activate_requested | bool
        - rhsm_identity is defined
        - rhsm_identity.rc != 0
        - rhsm_activation_key | length > 0
        - rhsm_org | length > 0

    - name: Check RHSM status after activation-key registration
      ansible.builtin.command: subscription-manager identity
      register: rhsm_after_activation_key
      changed_when: false
      failed_when: false
      when:
        - rhsm_activate_requested | bool
        - rhsm_identity is defined
        - rhsm_identity.rc != 0

    - name: Register host using username and password
      ansible.builtin.command: >
        subscription-manager register
        --username={{ rhsm_username }}
        --password={{ rhsm_password }}
        --force
      register: rhsm_userpass_result
      changed_when: rhsm_userpass_result.rc == 0
      failed_when: false
      no_log: true
      when:
        - rhsm_activate_requested | bool
        - rhsm_identity is defined
        - rhsm_identity.rc != 0
        - rhsm_after_activation_key.rc | default(1) != 0
        - rhsm_username | length > 0
        - rhsm_password | length > 0

    - name: Auto-attach subscription when username/password registration is used
      ansible.builtin.command: subscription-manager attach --auto
      register: rhsm_auto_attach_result
      changed_when: rhsm_auto_attach_result.rc == 0
      failed_when: false
      no_log: true
      when:
        - rhsm_activate_requested | bool
        - rhsm_auto_attach_requested | bool
        - rhsm_userpass_result is defined
        - rhsm_userpass_result.rc | default(1) == 0

    - name: Verify final RHSM registration status
      ansible.builtin.command: subscription-manager identity
      register: rhsm_final_check
      changed_when: false
      failed_when: false
      when: rhsm_activate_requested | bool

    - name: Show RHSM diagnostic summary
      ansible.builtin.debug:
        msg:
          - "RHSM activation requested: {{ rhsm_activate_requested }}"
          - "Already registered before playbook: {{ rhsm_identity.rc == 0 if rhsm_identity is defined else false }}"
          - "Activation key provided: {{ rhsm_activation_key | length > 0 }}"
          - "Org provided: {{ rhsm_org | length > 0 }}"
          - "Username/password provided: {{ rhsm_username | length > 0 and rhsm_password | length > 0 }}"
          - "Satellite/server URL provided: {{ rhsm_server_url | length > 0 }}"
          - "Final RHSM registered: {{ rhsm_final_check.rc == 0 if rhsm_final_check is defined else false }}"
      when: rhsm_activate_requested | bool

    - name: Fail when RHSM registration failed
      ansible.builtin.fail:
        msg: >-
          RHSM registration failed on {{ inventory_hostname }}.

          Verify:
          - rhsm_activation_key
          - rhsm_org
          - rhsm_username/password
          - rhsm_server_url only if using Satellite

          For Red Hat hosted RHSM, leave rhsm_server_url blank.
      when:
        - rhsm_activate_requested | bool
        - rhsm_final_check is defined
        - rhsm_final_check.rc | default(1) != 0

    - name: Refresh subscription and repository metadata after registration
      ansible.builtin.shell: |
        subscription-manager refresh || true

        if command -v dnf >/dev/null 2>&1; then
          dnf clean all
          dnf makecache
        else
          yum clean all
          yum makecache
        fi
      args:
        executable: /bin/bash
      changed_when: true
      when:
        - rhsm_activate_requested | bool
        - rhsm_final_check is defined
        - rhsm_final_check.rc == 0

    - name: Register yum/dnf repolist
      ansible.builtin.shell: |
        set -o pipefail

        if command -v dnf >/dev/null 2>&1; then
          dnf repolist
        else
          yum repolist
        fi
      args:
        executable: /bin/bash
      register: yum_repolist
      changed_when: false
      failed_when: false

    - name: Detect AWS RHUI marketplace host
      ansible.builtin.set_fact:
        analysis_is_aws_rhui: >-
          {{
            (
              ansible_system_vendor | default('') in ['Amazon EC2', 'Xen']
              or
              ansible_product_uuid | default('') | regex_search('^(ec2|EC2)')
            )
            and
            (
              'rhui' in (yum_repolist.stdout | default('') | lower)
            )
          }}

    - name: Set Leapp upgrade type to RHUI for AWS RHUI hosts
      ansible.builtin.set_fact:
        leapp_upgrade_type: rhui
      when: analysis_is_aws_rhui | bool

    - name: Show AWS RHUI detection status
      ansible.builtin.debug:
        msg:
          - "AWS/RHUI host detected: {{ analysis_is_aws_rhui | bool }}"
          - "Leapp upgrade type: {{ leapp_upgrade_type }}"
          - "System vendor: {{ ansible_system_vendor | default('unknown') }}"
          - "Product name: {{ ansible_product_name | default('unknown') }}"
          - "Product UUID: {{ ansible_product_uuid | default('unknown') }}"

    - name: Set RHUI RHEL 7 extras repo
      ansible.builtin.set_fact:
        analysis_repos_el7: rhel-7-server-rhui-extras-rpms
      when:
        - analysis_is_aws_rhui | bool
        - ansible_distribution_major_version | int == 7

    - name: Enable RHUI RHEL 7 extras repo when needed
      ansible.builtin.command: yum-config-manager --enable {{ analysis_repos_el7 }}
      changed_when: true
      failed_when: false
      when:
        - analysis_is_aws_rhui | bool
        - ansible_distribution_major_version | int == 7
        - analysis_repos_el7 is defined

    - name: Set AWS RHUI Leapp package facts
      ansible.builtin.set_fact:
        analysis_packages_el7:
          - leapp
          - leapp-upgrade-el7toel8
          - leapp-rhui-aws
          - cockpit
          - cockpit-system
          - cockpit-leapp

        analysis_packages_el8:
          - leapp
          - leapp-upgrade-el8toel9
          - leapp-rhui-aws
          - cockpit
          - cockpit-system
          - cockpit-leapp
          - vdo

        analysis_packages_el9:
          - leapp
          - leapp-upgrade-el9toel10
          - leapp-rhui-aws
          - cockpit
          - cockpit-system
      when: analysis_is_aws_rhui | bool

    - name: Set standard Leapp package facts for non-RHUI hosts
      ansible.builtin.set_fact:
        analysis_packages_el7:
          - leapp
          - leapp-upgrade-el7toel8
          - cockpit
          - cockpit-system
          - cockpit-leapp

        analysis_packages_el8:
          - leapp
          - leapp-upgrade-el8toel9
          - cockpit
          - cockpit-system
          - cockpit-leapp
          - vdo

        analysis_packages_el9:
          - leapp
          - leapp-upgrade-el9toel10
          - cockpit
          - cockpit-system
      when: not analysis_is_aws_rhui | bool

    - name: Install correct Leapp package set
      ansible.builtin.package:
        name: >-
          {{
            analysis_packages_el7
            if ansible_distribution_major_version | int == 7
            else analysis_packages_el8
            if ansible_distribution_major_version | int == 8
            else analysis_packages_el9
          }}
        state: present
      register: leapp_install_result
      failed_when: false

    - name: Clean yum/dnf metadata after Leapp package install
      ansible.builtin.shell: |
        if command -v dnf >/dev/null 2>&1; then
          dnf clean all
        else
          yum clean all
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Check if leapp command exists
      ansible.builtin.shell: command -v leapp
      args:
        executable: /bin/bash
      register: leapp_command_check
      changed_when: false
      failed_when: false

    - name: Check installed Leapp packages
      ansible.builtin.shell: rpm -qa | grep -E '^leapp|^python3-leapp|^leapp-rhui' | sort
      args:
        executable: /bin/bash
      register: leapp_installed_packages
      changed_when: false
      failed_when: false

    - name: Show installed Leapp packages
      ansible.builtin.debug:
        var: leapp_installed_packages.stdout_lines

    - name: Fail clearly when Leapp is unavailable
      ansible.builtin.fail:
        msg: >-
          Missing Leapp package on {{ inventory_hostname }}.
          Leapp was not found and could not be installed.

          RHSM registration enabled: {{ rhsm_activate_requested }}.
          Leapp upgrade type: {{ leapp_upgrade_type }}.

          {% if rhsm_activate_requested | bool %}
          Check RHSM/Satellite registration, enabled repositories, or rhsm_server_url.
          {% elif analysis_is_aws_rhui | default(false) | bool %}
          RHSM registration is disabled and this appears to be an AWS RHUI host.
          Check RHUI repositories and package availability.
          {% else %}
          RHSM registration is disabled.
          Enable RHSM/Satellite registration or ensure Leapp repositories are already available.
          {% endif %}
      when: leapp_command_check.rc != 0

    - name: Show final Leapp readiness status
      ansible.builtin.debug:
        msg: >-
          Final Leapp readiness for {{ inventory_hostname }}:
          {% if leapp_command_check.rc == 0 %}
          READY - leapp is installed at {{ leapp_command_check.stdout }}.
          Leapp upgrade type: {{ leapp_upgrade_type }}.
          {% else %}
          NOT READY - leapp is unavailable.
          {% endif %}

  roles:
    - infra.leapp.analysis

  post_tasks:
    - name: Check if Leapp answerfile exists
      ansible.builtin.stat:
        path: /var/log/leapp/answerfile
      register: leapp_answerfile

    - name: Confirm check_vdo True in Leapp answerfile
      ansible.builtin.replace:
        path: /var/log/leapp/answerfile
        regexp: '(\[check_vdo\][\s\S]*?)# confirm ='
        replace: '\1confirm = True'
      when: leapp_answerfile.stat.exists

    - name: Get report file status
      ansible.builtin.stat:
        path: /var/log/leapp/leapp-report.json
      register: report_file

    - name: Log preupgrade report
      when:
        - report_file.stat.exists
        - splunk_url is defined
        - splunk_index is defined
        - splunk_hectoken is defined
      block:
        - name: Gather EC2 metadata facts when running on EC2
          amazon.aws.ec2_metadata_facts:
          ignore_errors: true
          when: analysis_is_aws_rhui | default(false) | bool

        - name: Collect JSON report results
          ansible.builtin.slurp:
            src: /var/log/leapp/leapp-report.json
          register: leapp_report

        - name: Send event to Splunk
          ansible.builtin.uri:
            url: "{{ splunk_url }}"
            headers:
              Authorization: "Splunk {{ splunk_hectoken }}"
            method: POST
            body:
              sourcetype: _json
              index: "{{ splunk_index }}"
              event:
                event_type: leapp_report
                hostname: "{{ ansible_facts.hostname | default(inventory_hostname) }}"
                fqdn: "{{ ansible_facts.fqdn | default(inventory_hostname) }}"
                job_id: "{{ awx_job_id | default('undefined') }}"
                os_version: "{{ ansible_facts.distribution_version | default('undefined') }}"
                virtualization_type: "{{ ansible_virtualization_type | default('unknown') }}"
                virtualization_role: "{{ ansible_virtualization_role | default('unknown') }}"
                system_vendor: "{{ ansible_system_vendor | default('unknown') }}"
                product_name: "{{ ansible_product_name | default('unknown') }}"
                rhsm_activate: "{{ rhsm_activate_requested | default(false) }}"
                rhsm_server_url: "{{ rhsm_server_url | default('') }}"
                rhui_host: "{{ analysis_is_aws_rhui | default(false) }}"
                leapp_upgrade_type: "{{ leapp_upgrade_type }}"
                pet_app_env: "{{ ['Dev', 'Test', 'Prod'] | random(seed=inventory_hostname) }}"
                pet_app_team: "{{ ['Bird', 'Cat', 'Dog', 'Fish', 'Hamster', 'Lizard', 'Snake'] | random(seed=inventory_hostname) }}"
                region: "{{ ansible_ec2_placement_region | default('undefined') }}"
                report: "{{ leapp_report.content | b64decode | from_json }}"
            body_format: json
            return_content: true
          delegate_to: localhost
          become: false
          changed_when: false
          ignore_errors: true
          register: splunk_send
          no_log: true

        - name: Show Splunk send result
          ansible.builtin.debug:
            msg: "Splunk event send attempted."
          when: splunk_send is defined
...